<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enron Archive — Email Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,300;1,9..40,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="./app.css">
    <script type="text/javascript" src="./javascripts/jquery.js"></script>
    <script type="text/javascript" src="./javascripts/underscore.js"></script>
    <script type="text/javascript" src="./javascripts/enron-search.js"></script>
    <script type="text/javascript">
      $(document).ready(function() {
        new EnronSearch({
          searchInput: $('#search-input'),
          searchResults: $('#email-list'),
          highlights: $('#highlights'),
          terms: $('#terms')
        });
      });
    </script>
  </head>
  <body>
    <div class="app-container">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1 class="logo">Enron<br><span>Archive</span></h1>
        </div>

        <nav class="sidebar-nav">
          <a href="#" class="nav-item active" id="nav-search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            Search
          </a>
          <a href="#" class="nav-item" id="nav-bookmarks">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
            </svg>
            Saved
            <span class="badge" id="bookmark-count"></span>
          </a>
          <a href="#" class="nav-item" id="nav-spam">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
            </svg>
            Spam
            <span class="badge" id="spam-count"></span>
          </a>
        </nav>

        <div class="sidebar-footer">
          <p class="dataset-info">
            Dataset from <a href="https://www.cs.cmu.edu/~enron/" target="_blank">CMU</a><br>
            Powered by <a href="http://www.elasticsearch.org/" target="_blank">ElasticSearch</a>
          </p>
        </div>
      </aside>

      <!-- Main Content Wrapper -->
      <div class="main-wrapper">
      <!-- Main Content -->
      <main class="main-content">
        <!-- Search Header -->
        <header class="search-header">
          <div class="search-wrapper">
            <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
            <input type="text" id="search-input" placeholder="Search emails by name, subject, or content..." autocomplete="off">
            <div id="highlights" class="autocomplete-suggestion hidden"></div>
          </div>
          <div id="terms" class="search-tags"></div>
        </header>

        <!-- Results Header -->
        <div class="results-header">
          <div class="results-count">
            <span id="result-count">0</span> emails
          </div>
          <div class="sort-controls">
            <div class="tag-filter-wrapper">
              <button id="tag-filter-btn" class="tag-filter-btn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
                  <line x1="7" y1="7" x2="7.01" y2="7"/>
                </svg>
                <span id="tag-filter-label">All</span>
              </button>
              <div id="tag-filter-dropdown" class="tag-filter-dropdown hidden"></div>
            </div>
            <label>Sort by date:</label>
            <button id="sort-toggle" class="sort-btn" data-sort="asc">
              <svg id="sort-icon-asc" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 5v14M5 12l7-7 7 7"/>
              </svg>
              <svg id="sort-icon-desc" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M12 19V5M5 12l7 7 7-7"/>
              </svg>
              <span id="sort-label">Oldest first</span>
            </button>
          </div>
        </div>

        <!-- Loading State -->
        <div id="loading-state" class="loading-state hidden">
          <div class="loading-skeleton"></div>
          <div class="loading-skeleton"></div>
          <div class="loading-skeleton"></div>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state hidden">
          <div class="empty-icon">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
              <polyline points="22,6 12,13 2,6"></polyline>
            </svg>
          </div>
          <h2>No Results Found</h2>
          <p>Try a different search term or clear your filters.</p>
        </div>

        <!-- Email List -->
        <div id="email-list" class="email-list"></div>

        <!-- Pagination -->
        <div id="pagination" class="pagination hidden">
          <button id="prev-page" class="pagination-btn" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Previous
          </button>
          <span id="page-info" class="page-info"></span>
          <button id="next-page" class="pagination-btn">
            Next
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </div>
      </main>

      <!-- Email Detail Panel (for bookmarks view) -->
      <aside id="bookmarks-panel" class="detail-panel hidden">
        <div class="panel-header">
          <h2>Saved Emails</h2>
          <button id="close-bookmarks" class="close-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="bookmarks-list" class="panel-content"></div>
      </aside>

      <!-- Spam Panel -->
      <aside id="spam-panel" class="detail-panel hidden">
        <div class="panel-header">
          <h2>Spam</h2>
          <button id="close-spam" class="close-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>
        <div id="spam-list" class="panel-content"></div>
      </aside>

      <!-- Email Detail Panel (right side) -->
      <aside id="email-detail-panel" class="email-detail-panel hidden">
        <!-- Toolbar -->
        <div class="email-toolbar">
          <div class="toolbar-left">
            <button id="close-email-panel" class="toolbar-btn" title="Back to inbox">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
            </button>
          </div>
          <div class="toolbar-right">
            <div class="tag-dropdown-wrapper">
              <button id="panel-tag" class="toolbar-btn" title="Add tag">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/>
                  <line x1="7" y1="7" x2="7.01" y2="7"/>
                </svg>
              </button>
              <div id="tag-dropdown" class="tag-dropdown hidden">
                <div class="tag-dropdown-header">Add Tag</div>
                <div class="tag-input-wrapper">
                  <input type="text" id="new-tag-input" placeholder="New tag..." maxlength="20">
                  <button id="add-tag-btn" class="add-tag-btn">+</button>
                </div>
                <div id="existing-tags" class="existing-tags"></div>
              </div>
            </div>
            <button id="panel-spam" class="toolbar-btn" title="Mark as spam">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="4.93" y1="4.93" x2="19.07" y2="19.07"></line>
              </svg>
            </button>
            <button id="panel-bookmark" class="toolbar-btn" title="Save email">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"></path>
              </svg>
            </button>
            <button id="fullscreen-email" class="toolbar-btn" title="Fullscreen">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="15 3 21 3 21 9"></polyline>
                <polyline points="9 21 3 21 3 15"></polyline>
                <line x1="21" y1="3" x2="14" y2="10"></line>
                <line x1="3" y1="21" x2="10" y2="14"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Email Content -->
        <div class="email-view-content">
          <!-- Subject -->
          <div class="email-subject-bar">
            <h1 id="panel-subject" class="email-subject-title"></h1>
          </div>

          <!-- Sender Header -->
          <div class="email-sender-header">
            <div class="sender-avatar" id="panel-avatar"></div>
            <div class="sender-info">
              <div class="sender-line">
                <span class="sender-name" id="panel-sender-name"></span>
                <span class="sender-email" id="panel-from"></span>
              </div>
              <div class="recipient-line">
                <span class="recipient-label">to</span>
                <span class="recipient-value" id="panel-to"></span>
                <button class="expand-details-btn" id="expand-details" title="Show details">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M6 9l6 6 6-6"/>
                  </svg>
                </button>
              </div>
            </div>
            <div class="email-timestamp" id="panel-date"></div>
          </div>

          <!-- Expanded Details (hidden by default) -->
          <div class="email-details-expanded hidden" id="email-details-expanded">
            <div class="detail-row">
              <span class="detail-label">from:</span>
              <span class="detail-value" id="panel-from-full"></span>
            </div>
            <div class="detail-row">
              <span class="detail-label">to:</span>
              <span class="detail-value" id="panel-to-full"></span>
            </div>
            <div class="detail-row" id="panel-cc-row">
              <span class="detail-label">cc:</span>
              <span class="detail-value" id="panel-cc"></span>
            </div>
            <div class="detail-row">
              <span class="detail-label">date:</span>
              <span class="detail-value" id="panel-date-full"></span>
            </div>
          </div>

          <!-- Email Tags Bar -->
          <div id="email-tags-bar" class="email-tags-bar hidden">
            <span class="tags-label">Tags:</span>
            <div id="email-tags" class="email-tags"></div>
          </div>

          <!-- View Toggle -->
          <div class="view-toggle-bar">
            <div class="view-toggle">
              <button id="view-text" class="view-btn active">Plain Text</button>
              <button id="view-html" class="view-btn">HTML</button>
            </div>
          </div>

          <!-- Email Body -->
          <div class="email-body-container">
            <div id="panel-body" class="email-body"></div>
          </div>
        </div>
      </aside>
      </div><!-- end main-wrapper -->
    </div>
  </body>
</html>
